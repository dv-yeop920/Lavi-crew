html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;lavi-crew-requirements&quot;&gt;
  &lt;style&gt;
    #lavi-crew-requirements { color: var(--foreground); }
    #lavi-crew-requirements section { margin-top: 24px; }
    #lavi-crew-requirements h2 { margin-bottom: 8px; }
    #lavi-crew-requirements table { width: 100%; border-collapse: collapse; }
    #lavi-crew-requirements th, #lavi-crew-requirements td { padding: 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
    #lavi-crew-requirements th { color: var(--muted-foreground); font-weight: 500; }
    #lavi-crew-requirements ul { padding-left: 20px; }
  &lt;/style&gt;
  &lt;section&gt;
    &lt;h2&gt;MVP 기획 상태&lt;/h2&gt;
    &lt;p&gt;Supabase Auth·RLS와 인원·프로필·초대 코드·일정·신청·배정·출석·급여·공지 화면의 실제 데이터 연결을 구현했다. 카카오 알림톡 발송 처리기는 구현했으며 운영 전 제공자 자격 증명·승인 템플릿과 자동 호출 스케줄을 설정하고 실발송을 인증해야 한다.&lt;/p&gt;
  &lt;/section&gt;
  &lt;section&gt;
    &lt;h2&gt;역할과 권한&lt;/h2&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;역할&lt;/th&gt;&lt;th&gt;권한&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;관리자 1명&lt;/td&gt;&lt;td&gt;스케줄 생성·마감·배정·정정·취소, 출석 확정, 인원별 시급 관리, 공지 관리, 구성원 계정 관리, 배정 참고 이력 조회&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;알바생&lt;/td&gt;&lt;td&gt;월별 주말 스케줄 신청·마감 전 취소, 확정 스케줄·공지·본인 급여·본인 근무 이력 조회&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/section&gt;
  &lt;section&gt;
    &lt;h2&gt;계정과 접근&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;회원가입: 이름, 이메일을 로그인 아이디로 사용하고, 비밀번호·휴대폰 번호·초대 코드·카카오 알림 수신 동의를 입력한다.&lt;/li&gt;
      &lt;li&gt;회원가입·로그인과 입력 폼은 제출 시 서버에서 필드별 유효성을 다시 검사한다. 누락되거나 잘못된 값은 해당 입력 아래에 구체적인 한국어 문구와 빨간색 오류 상태로 표시하며 내부 DB·인증 오류 원문은 노출하지 않는다.&lt;/li&gt;
      &lt;li&gt;가입 전 서버 RPC로 정규화된 이름·휴대폰 번호의 중복과 초대 코드의 활성·만료·사용 가능 횟수를 한 번에 검사한다. 이름과 휴대폰 번호는 각각 고유하며 경쟁 요청은 DB 제약과 가입 트리거가 다시 차단한다.&lt;/li&gt;
      &lt;li&gt;가입 후 이메일 확인을 완료해야 로그인할 수 있다. 이메일 확인 링크는 허용된 Redirect URL의 인증 완료 화면으로 연결한다.&lt;/li&gt;
      &lt;li&gt;초대 코드는 관리자가 생성하며 만료일과 사용 가능 횟수를 설정한다.&lt;/li&gt;
      &lt;li&gt;비밀번호 재설정은 가입 이메일로 재설정 링크를 발송한다.&lt;/li&gt;
      &lt;li&gt;회원 탈퇴는 데이터 삭제가 아닌 비활성화 처리한다. 비활성 계정은 로그인·신청·배정이 불가하고 과거 이력은 유지한다.&lt;/li&gt;
      &lt;li&gt;이메일과 휴대폰 번호는 화면에서 마스킹하여 표시한다. 휴대폰 번호는 카카오 알림톡 수신 연락처로 사용한다.&lt;/li&gt;
      &lt;li&gt;관리자 인원 목록과 상세 화면에는 관리자 본인을 포함하고 마스킹한 이메일과 휴대폰 연락처, 개인 시급, 입사일과 입사일로부터 현재까지의 근속 기간을 연·월·일 단위로 표시한다. 인원 카드는 전체를 링크로 만들지 않고 카드 내부의 독립된 수정 버튼을 눌렀을 때만 활성화된 수정 폼으로 이동하며 완료와 취소 액션을 함께 제공한다. 수정 저장이 성공하면 인원 목록으로 이동하고, 실패하면 수정 폼과 입력값을 유지한다. 회원 삭제는 확인 단계를 거쳐 계정을 비활성화하며 기존 근무·출석·급여 이력을 보존한다. 단일 관리자 계정은 삭제할 수 없다.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;
  &lt;section&gt;
    &lt;h2&gt;공통 화면과 내비게이션&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;로그인 전 첫 화면은 이메일·비밀번호 로그인 화면이며 회원가입 화면으로 이동할 수 있다.&lt;/li&gt;
      &lt;li&gt;로그인 후 상단 내비게이션에는 서비스명과 공통 계정 액션을 표시하고, 알바·관리자 같은 역할명 텍스트는 표시하지 않는다.&lt;/li&gt;
      &lt;li&gt;모바일 하단 내비게이션은 목적을 나타내는 아이콘과 텍스트 라벨을 함께 사용하고 현재 위치를 색상 외의 상태 정보로도 구분한다.&lt;/li&gt;
      &lt;li&gt;알바 하단 메뉴는 홈·신청·내 일정·급여·MY, 관리자 하단 메뉴는 홈·일정·관리로 구성한다. 배정은 일정 화면 안에서 처리한다.&lt;/li&gt;
      &lt;li&gt;고정 하단 내비게이션은 모바일 safe area를 반영하고 본문을 가리지 않아야 한다.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;
  &lt;section&gt;
    &lt;h2&gt;스케줄&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;알바생은 달력에서 한 달 단위의 주말 근무 가능일을 신청한다.&lt;/li&gt;
      &lt;li&gt;알바생과 관리자의 월간 달력은 요일 헤더와 날짜 숫자에서 토요일을 파란색, 일요일을 빨간색으로 구분한다. 선택 상태는 배경과의 텍스트 대비를 우선한다.&lt;/li&gt;
      &lt;li&gt;관리자는 대상 월의 신청 기간과 마감일을 한 번 설정하며, 일정 생성 전에는 마감일을 수정하거나 해당 월 전체를 즉시 마감하고 조건에 따라 다시 열 수 있다. 일정이 한 번이라도 생성된 뒤에는 마감일 변경과 재개가 모두 금지된다.&lt;/li&gt;
      &lt;li&gt;관리자 일정 첫 화면은 조회 전용 월간 달력이다. 이전·다음 화살표로 연도와 월을 이동할 수 있으며 달력 날짜를 직접 선택하지 않는다. 같은 화면에서 대상 월의 신청 기간과 월 전체 마감 날짜·시간을 생성·수정하고, 즉시 마감하거나 다시 열 수 있다. 날짜별 신청 마감일은 두지 않는다.&lt;/li&gt;
      &lt;li&gt;관리자는 달력 아래의 해당 월 일정 등록 버튼을 눌러 월별 스케줄 등록 화면으로 이동한다.&lt;/li&gt;
      &lt;li&gt;월별 일정 등록 화면에서는 신청 기간 정보를 조회 전용으로 확인할 수 있으며, 신청 기간을 관리하려면 일정 달력 화면으로 이동해야 한다.&lt;/li&gt;
      &lt;li&gt;월별 스케줄 등록 화면은 신청 기간의 마감 상태 확인과 일정 작성을 함께 제공하며, 신청 기간이 마감된 뒤에만 일정을 확정할 수 있다. 일정이 한 번이라도 생성된 월은 마감 시각을 변경하거나 신청 기간을 다시 열 수 없다.&lt;/li&gt;
      &lt;li&gt;월별 스케줄 등록 화면은 등록된 일정과 미등록 주말을 구분한다. 미등록 날짜마다 일정 설정을 활성화한 뒤 예식 개수, 근무 시작·종료 시간과 포지션 배정 테이블을 입력한다.&lt;/li&gt;
      &lt;li&gt;운영 포지션은 팀장·스캔·메인·드레스·축가·매니저·안내·대기실 8개가 전부이며 고정한다. 포지션 추가·삭제·비활성화와 포지션별 시급 설정은 제공하지 않는다. 매니저와 안내는 기본 2명, 나머지는 기본 1명이며 각 포지션에는 교육 인원 전용 추가 슬롯을 최대 1개 둘 수 있다.&lt;/li&gt;
      &lt;li&gt;포지션 행의 기본 슬롯은 삭제할 수 없고 교육 여부를 표시할 수 있다. 교육 인원 추가로 생성한 슬롯은 교육 상태로 고정하며 해당 슬롯에만 X 삭제 버튼을 표시한다. 인원 셀렉트는 선택한 날짜의 신청자만 표시하며 지난달 확정 출근 횟수, 포지션별 수행 횟수, 관리자가 설정한 가능한 포지션을 함께 표시한다.&lt;/li&gt;
      &lt;li&gt;스케줄 인원 배정 테이블은 모바일에서 포지션명을 카드 상단 전체 폭에 표시하고 인원 셀렉트·이력·추가 및 X 삭제 액션을 아래에 배치하는 세로 카드 구조로 전환한다. 셀렉트와 액션은 화면 안에서 조작 가능해야 하며 페이지 가로 스크롤을 만들지 않는다.&lt;/li&gt;
      &lt;li&gt;관리자는 해당 월에서 설정을 활성화한 날짜의 스케줄과 인원 배정만 최종 저장한다. 월 저장은 한 번의 원자 요청으로 처리하며 성공 즉시 일정은 게시, 배정은 확정 상태가 되고 출석 대기 기록이 생성된다.&lt;/li&gt;
      &lt;li&gt;달력 아래의 등록된 일정은 날짜별 카드 목록으로 표시하고, 카드를 선택하면 해당 날짜의 일별 일정 관리 화면으로 이동한다.&lt;/li&gt;
      &lt;li&gt;취소된 일정도 월 카드 목록과 일별 상세에 남기며 취소 상태·사유와 마지막 배정 이력을 조회할 수 있다. 취소 이력은 새 활성 배정이나 급여 정정을 막지 않는다.&lt;/li&gt;
      &lt;li&gt;일별 일정 관리 화면은 스케줄 등록과 동일한 포지션 배정 테이블을 조회용으로 재사용한다. 수정 버튼을 누르면 예식 개수·근무시간·배정 인원을 편집하고 저장할 수 있으며 일정 취소도 같은 화면에서 처리한다. 기존 확정 배정자가 현재 미신청 상태여도 기존 선택값은 표시·유지할 수 있지만, 새로 추가하거나 교체하는 인원은 해당 날짜 신청자만 선택·저장할 수 있다.&lt;/li&gt;
      &lt;li&gt;신청 화면은 현재 신청한 날짜 목록과 신청 일수를 보여주고, 각 날짜에 명시적인 신청 취소 액션을 제공한다.&lt;/li&gt;
      &lt;li&gt;월 신청 마감 전에는 알바생이 날짜별 신청을 취소하고 변경 내용을 저장할 수 있으며, 월 마감 후에는 해당 월의 모든 신청·취소가 잠긴다.&lt;/li&gt;
      &lt;li&gt;내 일정의 월·주·일 보기 전환 시 선택한 단위에 맞게 조회 기간, 일정 횟수, 일정 목록이 함께 변경된다.&lt;/li&gt;
      &lt;li&gt;관리자 홈의 이번 주 일정은 일정 관리에 등록된 일정 중 월요일부터 일요일까지의 데이터를 사용한다. 일정 관리의 등록 일정 카드 컴포넌트를 요약 형태로 재사용하며 배정 인원 수는 표시하지 않고 날짜·예식 개수·근무시간을 표시한다.&lt;/li&gt;
      &lt;li&gt;관리자는 선택한 날짜에 신청한 인원만 배정할 수 있으며, 관리자 본인도 해당 날짜를 신청한 경우 근무자로 배정할 수 있다.&lt;/li&gt;
      &lt;li&gt;관리자는 알바 관리에서 구성원별 가능한 포지션을 설정·수정한다.&lt;/li&gt;
      &lt;li&gt;배정마다 포지션과 교육 여부를 설정한다. 교육 여부는 알바생 프로필이 아닌 개별 배정의 속성이다.&lt;/li&gt;
      &lt;li&gt;배정은 초안·확정·취소 상태와 배정 관리자·확정·취소 일시를 보존한다.&lt;/li&gt;
      &lt;li&gt;확정 후 스케줄 변경은 대상 알바에게 알림톡을 보내며, 삭제 대신 취소 상태로 보존한다.&lt;/li&gt;
      &lt;li&gt;출석 확정 후에는 일반 수정 대신 관리자 정정 절차로만 변경한다. 정정 사유와 함께 출석 상태 또는 실제 근무 시각 중 하나 이상을 변경해야 하며 동일 값 재저장은 허용하지 않는다.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;
  &lt;section&gt;
    &lt;h2&gt;출석과 급여&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;관리자가 각 배정에 대해 출석 또는 결근을 확정한다.&lt;/li&gt;
      &lt;li&gt;급여는 출석 확정된 배정만 대상으로 하며, 관리자가 확정한 실제 출근·퇴근 시각을 사용한다. 휴게시간은 공제하지 않는다.&lt;/li&gt;
      &lt;li&gt;시급은 관리자만 인원 관리 상세에서 구성원별로 등록·수정하며, 구성원은 자신의 적용 시급을 조회한다.&lt;/li&gt;
      &lt;li&gt;하루 총 근무시간 중 9시간 이하에는 해당 인원의 개인 시급, 9시간 초과분에는 개인 시급의 1.5배를 적용한다.&lt;/li&gt;
      &lt;li&gt;식대, 교통비, 주휴수당은 지급 항목에 포함하지 않는다.&lt;/li&gt;
      &lt;li&gt;알바생은 주별·월별 확정 급여와 누적 월 평균 급여를 조회한다. 예상 급여는 제공하지 않는다.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;
  &lt;section&gt;
    &lt;h2&gt;공지와 알림&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;관리자는 공지를 등록·수정·삭제하고 중요 공지를 고정할 수 있다.&lt;/li&gt;
      &lt;li&gt;알바생은 공지를 조회하며, 관리자는 읽음 여부를 확인한다.&lt;/li&gt;
      &lt;li&gt;스케줄 확정, 수정, 취소 시 카카오 알림톡 대상 로그를 생성한다. 서버 전용 발송 작업은 동의한 수신자의 대기 로그를 임대로 선점해 카카오 제공자 API로 전송하며 동시 실행과 중복 발송을 방지한다.&lt;/li&gt;
      &lt;li&gt;알림 발송 기록에는 대상 스케줄·배정, 발송 상태, 시도 횟수, 다음 재시도 시각, 카카오 메시지 ID와 안전한 실패 사유를 남긴다. 최대 3회까지 재시도한 뒤 실패로 종료한다. 운영 전 제공자 자격 증명·승인 템플릿·자동 호출 스케줄과 실발송 인증이 필요하다.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;
  &lt;section&gt;
    &lt;h2&gt;배정 참고 정보&lt;/h2&gt;
    &lt;p&gt;별도의 통계·급여 관리 카테고리는 두지 않으며, 알바 관리 상세와 스케줄 인원 선택 영역에서 확인한다.&lt;/p&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;통계&lt;/th&gt;&lt;th&gt;활용&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;알바별 월 평균 신청 일수&lt;/td&gt;&lt;td&gt;근무 의사와 신청 빈도를 고려한 배정&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;지난달 출근 횟수 · 포지션별 수행 횟수 · 가능한 포지션&lt;/td&gt;&lt;td&gt;경험과 업무 편중을 고려한 포지션 배정&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
