    &lt;ul&gt;
      &lt;li&gt;알바는 본인 프로필·신청·배정·출석·급여만 조회하고, 본인 신청은 대상 월의 신청 기간이 open일 때만 생성·취소한다.&lt;/li&gt;
      &lt;li&gt;profiles.hourly_wage는 admin만 수정하고 구성원은 자신의 개인 시급만 조회한다. 일반 프로필 수정으로 시급이 변경되지 않도록 권한을 분리한다.&lt;/li&gt;
      &lt;li&gt;공지·고정 포지션·가능 포지션은 인증 구성원이 조회하고, 생성·수정·삭제·마감·배정·출석 확정·가능 포지션 설정은 admin만 수행한다.&lt;/li&gt;
      &lt;li&gt;role=admin은 부분 UNIQUE 인덱스로 한 행만 허용하며 관리자 부여는 초기화 절차에서만 수행한다.&lt;/li&gt;
      &lt;li&gt;근무일별 신청은 application_period_id+work_date+worker_id, 활성 배정은 shift_id+worker_id 조합의 중복을 제약한다.&lt;/li&gt;
      &lt;li&gt;일정 생성 이력이 존재하는 신청 기간은 마감 시각 변경과 재개를 DB 트리거로 차단한다.&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;private.schedule_registration_requests&lt;/code&gt;는 요청 ID·요청자·대상 월·payload hash·완료 결과를 보관하며 Data API 역할에는 노출하지 않는다.&lt;/li&gt;
      &lt;li&gt;&lt;code&gt;private.invite_mutation_requests&lt;/code&gt;는 초대 코드 생성·중지의 요청 ID·payload hash·결과를 보관하고 Data API 역할의 직접 접근을 허용하지 않는다.&lt;/li&gt;
      &lt;li&gt;신청 기간은 &lt;code&gt;save_schedule_application_period&lt;/code&gt;와 &lt;code&gt;set_schedule_application_period_status&lt;/code&gt;, 알바의 월별 신청은 &lt;code&gt;save_own_monthly_schedule_applications&lt;/code&gt; RPC로 원자·멱등 처리한다.&lt;/li&gt;
      &lt;li&gt;월별 선택 날짜 일정·확정 배정·출석 대기·알림 발송 대기는 &lt;code&gt;save_monthly_schedule_registration&lt;/code&gt; RPC 한 번으로 원자·멱등 저장한다. 일별 변경·취소와 출석 확정·급여 반영도 각 RPC 트랜잭션으로 처리한다.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;
  &lt;script&gt;
    const root = document.getElementById(&#x27;supabase-erd&#x27;)
    const chart = root.querySelector(&#x27;.chart&#x27;)
    const lines = document.getElementById(&#x27;erd-lines&#x27;)
    const links = [
      [&#x27;users&#x27;, &#x27;profiles&#x27;], [&#x27;profiles&#x27;, &#x27;invites&#x27;], [&#x27;profiles&#x27;, &#x27;periods&#x27;], [&#x27;periods&#x27;, &#x27;shifts&#x27;], [&#x27;profiles&#x27;, &#x27;shifts&#x27;, &#x27;left&#x27;], [&#x27;profiles&#x27;, &#x27;notices&#x27;],
      [&#x27;periods&#x27;, &#x27;applications&#x27;], [&#x27;profiles&#x27;, &#x27;applications&#x27;, &#x27;left&#x27;], [&#x27;shifts&#x27;, &#x27;assignments&#x27;], [&#x27;profiles&#x27;, &#x27;assignments&#x27;, &#x27;right&#x27;], [&#x27;positions&#x27;, &#x27;assignments&#x27;], [&#x27;profiles&#x27;, &#x27;skills&#x27;, &#x27;left&#x27;], [&#x27;positions&#x27;, &#x27;skills&#x27;],
      [&#x27;assignments&#x27;, &#x27;attendance&#x27;], [&#x27;profiles&#x27;, &#x27;attendance&#x27;, &#x27;left&#x27;], [&#x27;assignments&#x27;, &#x27;items&#x27;], [&#x27;attendance&#x27;, &#x27;items&#x27;], [&#x27;payrolls&#x27;, &#x27;items&#x27;],
      [&#x27;notices&#x27;, &#x27;reads&#x27;], [&#x27;profiles&#x27;, &#x27;reads&#x27;, &#x27;right&#x27;], [&#x27;profiles&#x27;, &#x27;notifications&#x27;, &#x27;right&#x27;], [&#x27;shifts&#x27;, &#x27;notifications&#x27;, &#x27;right&#x27;],
      [&#x27;assignments&#x27;, &#x27;notifications&#x27;, &#x27;right&#x27;], [&#x27;profiles&#x27;, &#x27;payrolls&#x27;, &#x27;left&#x27;],
    ]
    const ns = &#x27;http://www.w3.org/2000/svg&#x27;
    const draw = () =&gt; {
      const box = chart.getBoundingClientRect()
      lines.querySelectorAll(&#x27;.connection&#x27;).forEach((line) =&gt; line.remove())
      lines.setAttribute(&#x27;viewBox&#x27;, `0 0 ${box.width} ${box.height}`)
      links.forEach(([fromId, toId, route]) =&gt; {
        const from = document.getElementById(fromId).getBoundingClientRect()
        const to = document.getElementById(toId).getBoundingClientRect()
        const fx = from.left - box.left + from.width / 2
        const fy = from.top - box.top + from.height / 2
        const tx = to.left - box.left + to.width / 2
        const ty = to.top - box.top + to.height / 2
        let d
        if (route === &#x27;right&#x27; || route === &#x27;left&#x27;) {
          const side = route === &#x27;right&#x27; ? box.width - 12 : 12
          const startX = route === &#x27;right&#x27; ? from.right - box.left : from.left - box.left
          const endX = route === &#x27;right&#x27; ? to.right - box.left : to.left - box.left
          d = `M ${startX} ${fy} L ${side} ${fy} L ${side} ${ty} L ${endX} ${ty}`
        } else if (Math.abs(ty - fy) &gt;= Math.abs(tx - fx)) {
          const startY = ty &gt; fy ? from.bottom - box.top : from.top - box.top
          const endY = ty &gt; fy ? to.top - box.top : to.bottom - box.top
          const bend = (startY + endY) / 2
          d = `M ${fx} ${startY} L ${fx} ${bend} L ${tx} ${bend} L ${tx} ${endY}`
        } else {
          const startX = tx &gt; fx ? from.right - box.left : from.left - box.left
          const endX = tx &gt; fx ? to.left - box.left : to.right - box.left
          const bend = (startX + endX) / 2
          d = `M ${startX} ${fy} L ${bend} ${fy} L ${bend} ${ty} L ${endX} ${ty}`
        }
        const path = document.createElementNS(ns, &#x27;path&#x27;)
        path.setAttribute(&#x27;d&#x27;, d)
        path.setAttribute(&#x27;class&#x27;, &#x27;connection&#x27;)
        path.setAttribute(&#x27;marker-end&#x27;, &#x27;url(#erd-arrow)&#x27;)
        lines.appendChild(path)
      })
    }
    new ResizeObserver(draw).observe(chart)
    window.addEventListener(&#x27;resize&#x27;, draw)
    requestAnimationFrame(draw)
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
